<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cliente</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

   <header class="navbar shadow p-3 mb-5 bg-body rounded">
        <h1>Sistema de Agendamento</h1>
       
    </header>

    <main class="container text-center  bg-body rounded shadow ">
    
        
           
<form class="agendar-form p-4 mx-auto" style="max-width: 600px; ">

      <h2 class="mb-4">Agendar Cliente</h2>


        <div >
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control">
        </div>

        <div >
            <label for="data" class="form-label">Data</label>
            <input type="date" id="data" class="form-control">
        </div>

        <div >
            <label for="horario" class="form-label">Horário</label>
            <input type="time" id="horario" class="form-control">
        </div>

        <div class="mb-3"> <button class="btn btn-primary p-3 m-5" >Agendar</button></div>

       
              
</form>





        
        

    </main>





    <footer >
        <p>&copy;  Sistema de Agendamento</p>
    </footer>
 


    
</body>
</html>
